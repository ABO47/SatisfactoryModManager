name: Build Windows Only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'wails.json'
      - '.github/workflows/build-windows-only.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (Windows snapshot)
        uses: ./.github/actions/goreleaser
        with:
          args: release --split --clean -p 1 --snapshot
        env:
          GGOOS: windows

      - name: Archive installer only
        uses: actions/upload-artifact@v4
        with:
          name: SatisfactoryModManager-installer
          path: dist/**/*.exe
